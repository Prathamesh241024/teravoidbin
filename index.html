<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181F">
<title>My Library</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.93/epub.min.js"></script>
<style>
:root{--bg:#EDF0F4;--card:#FFFFFF;--ink:#14181F;--mute:#5F6B7A;--line:#D4DAE2;--acc:#2F5FC4;--accfg:#FFFFFF;
--serif:Charter,"Iowan Old Style",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181F;--card:#1E2530;--ink:#E9EDF2;--mute:#97A3B4;--line:#2D3644;--acc:#7FA4F2;--accfg:#10151C}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
header{max-width:720px;margin:0 auto;padding:20px 16px 8px}
h1{font:600 28px/1.2 var(--serif);margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 16px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:1 1 100%;padding-bottom:4px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
input[type=search]{flex:1;min-width:0;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.signin{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:8px 16px 40px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
.item h2{font:600 18px/1.3 var(--serif);margin:0}
.meta{color:var(--mute);font-size:14px;margin:2px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--accfg);font:inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.empty{color:var(--mute);text-align:center;padding:40px 0}
#reader{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#reader.open{display:flex}
.top,.bot{display:flex;align-items:center;gap:8px;padding:8px 12px;border-color:var(--line);background:var(--card)}
.top{border-bottom:1px solid var(--line)}.bot{border-top:1px solid var(--line);justify-content:space-between}
.top .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 16px var(--serif)}
#stage{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
#pdfwrap{display:none;padding:8px;text-align:center}
#pdfwrap canvas{max-width:100%;box-shadow:0 1px 6px rgba(0,0,0,.25);background:#fff}
#epub{display:none;height:100%;background:#fff}
#info{color:var(--mute);font-size:14px}
</style>
</head>
<body>
<header>
  <h1>My Library</h1>
  <p class="sub">Research papers, novels and notes. Open any title and read it page by page.</p>
  <div class="bar">
    <div class="tabs" role="tablist" id="tabs"></div>
    <input type="search" id="q" placeholder="Search titles and authors" aria-label="Search">
    <button class="signin" id="signin">Sign in</button>
  </div>
</header>
<main id="list"></main>

<div id="reader" role="dialog" aria-modal="true">
  <div class="top">
    <button class="btn ghost" id="close">Close</button>
    <span class="t" id="rtitle"></span>
    <button class="btn" id="rdl">Download</button>
  </div>
  <div id="stage"><div id="pdfwrap"><canvas id="cv"></canvas></div><div id="epub"></div></div>
  <div class="bot">
    <button class="btn ghost" id="prev">Previous</button>
    <span id="info"></span>
    <button class="btn ghost" id="next">Next</button>
  </div>
</div>

<script>
// Sections shown as tabs. The "section" field in library.json must match a key here.
const SECTIONS={papers:"Academic Papers",novels:"Novels",notes:"Notes"};
// Step 2 (Firebase login) will set this to the signed-in user. Until then nobody is signed in.
let user=null;
let items=[],sec="papers",term="";
const $=id=>document.getElementById(id);

function renderTabs(){
  $("tabs").innerHTML="";
  for(const k in SECTIONS){
    const b=document.createElement("button");
    b.className="tab";b.role="tab";b.textContent=SECTIONS[k];
    b.setAttribute("aria-selected",k===sec);
    b.onclick=()=>{sec=k;renderTabs();renderList()};
    $("tabs").appendChild(b);
  }
}
function renderList(){
  const list=$("list");list.innerHTML="";
  const shown=items.filter(i=>i.section===sec&&(i.title+" "+(i.author||"")).toLowerCase().includes(term));
  if(!shown.length){list.innerHTML='<p class="empty">Nothing here yet. Add items to library.json.</p>';return}
  for(const it of shown){
    const d=document.createElement("div");d.className="item";
    d.innerHTML='<h2></h2><p class="meta"></p><div class="row"></div>';
    d.querySelector("h2").textContent=it.title;
    d.querySelector(".meta").textContent=(it.author||"Unknown author")+" – "+it.type.toUpperCase();
    const row=d.querySelector(".row");
    const r=document.createElement("button");r.className="btn";r.textContent="Read";r.onclick=()=>openReader(it);row.appendChild(r);
    if(it.downloadable)row.appendChild(dlButton(it));
    list.appendChild(d);
  }
}
function dlButton(it){
  const b=document.createElement("button");b.className="btn ghost";
  if(user){b.textContent="Download";b.onclick=()=>download(it)}
  else{b.textContent="Sign in to download";b.disabled=true}
  return b;
}
function download(it){const a=document.createElement("a");a.href=it.file;a.download="";document.body.appendChild(a);a.click();a.remove()}

// ---------- Reader ----------
let cur=null,pdf=null,pg=1,rend=null,book=null;
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

async function openReader(it){
  cur=it;$("rtitle").textContent=it.title;
  $("reader").classList.add("open");document.body.style.overflow="hidden";
  $("rdl").style.display=it.downloadable?"":"none";
  $("rdl").disabled=!user;$("rdl").textContent=user?"Download":"Sign in to download";
  $("info").textContent="Loading…";
  try{
    if(it.type==="pdf"){
      $("epub").style.display="none";$("pdfwrap").style.display="block";
      pdf=await pdfjsLib.getDocument(it.file).promise;pg=1;await showPdf();
    }else{
      $("pdfwrap").style.display="none";$("epub").style.display="block";$("epub").innerHTML="";
      book=ePub(it.file,{openAs:"epub"});
      rend=book.renderTo("epub",{width:"100%",height:"100%",flow:"paginated",spread:"none"});
      rend.on("relocated",l=>{$("info").textContent="Section "+(l.start.index+1)+" of "+book.spine.length});
      await rend.display();
    }
  }catch(e){$("info").textContent="Could not open this file. Check the file name in library.json."}
}
async function showPdf(){
  const p=await pdf.getPage(pg),st=$("stage");
  const w=Math.min(st.clientWidth-16,900),v=p.getViewport({scale:1}),s=w/v.width,vp=p.getViewport({scale:s}),r=window.devicePixelRatio||1;
  const c=$("cv");c.width=vp.width*r;c.height=vp.height*r;c.style.width=vp.width+"px";c.style.height=vp.height+"px";
  await p.render({canvasContext:c.getContext("2d"),viewport:vp,transform:[r,0,0,r,0,0]}).promise;
  $("info").textContent="Page "+pg+" of "+pdf.numPages;st.scrollTop=0;
}
function go(n){
  if(!cur)return;
  if(cur.type==="pdf"){const t=pg+n;if(t<1||t>pdf.numPages)return;pg=t;showPdf()}
  else if(rend){n>0?rend.next():rend.prev()}
}
$("next").onclick=()=>go(1);$("prev").onclick=()=>go(-1);
$("close").onclick=()=>{$("reader").classList.remove("open");document.body.style.overflow="";if(book){book.destroy();book=null;rend=null}pdf=null;cur=null};
$("rdl").onclick=()=>{if(user&&cur)download(cur)};
document.addEventListener("keydown",e=>{if(!cur)return;if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
let tx=0;$("stage").addEventListener("touchstart",e=>{tx=e.changedTouches[0].clientX},{passive:true});
$("stage").addEventListener("touchend",e=>{if(!cur||cur.type!=="pdf")return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>70)go(d<0?1:-1)},{passive:true});

// ---------- Start ----------
$("q").oninput=e=>{term=e.target.value.toLowerCase();renderList()};
$("signin").onclick=()=>alert("Sign-in comes in the next step, once the login service is connected.");
renderTabs();
fetch("library.json").then(r=>r.json()).then(d=>{items=d.items||[];renderList()})
  .catch(()=>{$("list").innerHTML='<p class="empty">Could not load library.json. Check that it is in the same folder as index.html.</p>'});
</script>
</body>
</html>
